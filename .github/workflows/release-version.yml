# One-button release orchestrator: bump → commit → tag → build → publish.
#
# Run from the Actions tab (workflow_dispatch).  Given a bump level
# (patch/minor/major), it:
#
#   1. bump:    increments the workspace version in every tracked version
#               file, in lockstep — Cargo.toml ([workspace.package],
#               inherited by all five crates), every npm workspace package
#               (via `npm version --workspaces`, which also resyncs
#               package-lock.json), and Cargo.lock (synced via
#               `cargo update --workspace`, never sed: unrelated packages
#               can share the version string).
#               Commits "Release vX.Y.Z" to main and pushes the
#               `sigmakee-vX.Y.Z` tag.
#
#   2. build-cli: calls release-sumo.yml with that tag — the same 5-platform
#               binary matrix + StarExec package a manually pushed tag gets.
#               (Called explicitly because a tag pushed with the default
#               GITHUB_TOKEN does not trigger tag workflows — GitHub's
#               recursion guard.)
#
#   3. npm-publish: builds the wasm package (via `npm ci`, which runs the
#               package's `prepare` hook) and publishes it to npm.
#
# One-time npm setup (no token, no secret): npmjs.com → the `sigmakee`
# package → Settings → Trusted Publisher → GitHub Actions, with
# repository = this repo and workflow filename = `release-version.yml`.
# The npm-publish job then authenticates via OIDC (`id-token: write`);
# see https://docs.npmjs.com/trusted-publishers.  Requires npm >= 11.5.1
# (Node 24's bundled npm) and a cloud-hosted runner — both satisfied here.
# After a release, `git pull` locally — the bump commit lands on the
# remote main.
#
# There is no separate LSP release workflow: the `sumo-lsp` binary is not
# published on its own cadence any more.

name: Trigger Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version component to increment
        type: choice
        options: [patch, minor, major]
        default: patch
      publish_npm:
        description: Publish the wasm package to npm
        type: boolean
        default: true

permissions:
  contents: write  # push the bump commit + tag; upload release artifacts

jobs:
  bump:
    name: bump version + tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag:     ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Bump workspace version
        id: bump
        run: |
          set -euo pipefail

          CUR=$(awk -F'"' '/^\[workspace\.package\]/{s=1} s && /^version/{print $2; exit}' Cargo.toml)
          [ -n "$CUR" ] || { echo "could not read [workspace.package] version"; exit 1; }

          MAJOR=${CUR%%.*}; REST=${CUR#*.}; MINOR=${REST%%.*}; PATCH=${REST#*.}
          case "${{ inputs.bump }}" in
            major) NEW="$((MAJOR + 1)).0.0" ;;
            minor) NEW="$MAJOR.$((MINOR + 1)).0" ;;
            *)     NEW="$MAJOR.$MINOR.$((PATCH + 1))" ;;
          esac
          echo "bump: $CUR -> $NEW"

          # Only the version line inside the [workspace.package] section.
          awk -v new="$NEW" '
              /^\[/ { sect = $0 }
              sect == "[workspace.package]" && $1 == "version" && !done {
                  sub(/"[0-9][0-9.]*"/, "\"" new "\""); done = 1
              }
              { print }
          ' Cargo.toml > Cargo.toml.bump && mv Cargo.toml.bump Cargo.toml

          # `npm version --workspaces` rewrites each package's own version but
          # NOT the ranges its siblings depend on -- which is why @sigma/web
          # pins its local deps to "*". Any other range stops matching the
          # moment the version moves, and npm then falls through to the public
          # registry and 404s on the private @sigma/language.
          npm version "$NEW" --workspaces --no-git-tag-version --allow-same-version
          npm install --package-lock-only

          # Sync Cargo.lock's workspace-member entries.
          cargo update --workspace --quiet

          echo "version=$NEW"          >> "$GITHUB_OUTPUT"
          echo "tag=sigmakee-v$NEW"    >> "$GITHUB_OUTPUT"

      - name: Commit + tag + push
        run: |
          set -euo pipefail
          NEW="${{ steps.bump.outputs.version }}"
          TAG="${{ steps.bump.outputs.tag }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock package.json package-lock.json packages/*/package.json
          git commit -m "Release v$NEW"
          git tag "$TAG"
          git push origin main "$TAG"

      - name: Create GitHub release
        # Created HERE, once, so the five build legs never race to create
        # it — they only upload assets.  Retried because the create call
        # has been observed 503ing ("Unicorn!" page); if generated notes
        # are what's failing server-side, fall back to plain notes — a
        # release without pretty notes beats no release.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.bump.outputs.tag }}"
          for i in 1 2 3; do
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes && exit 0
            echo "release create attempt $i failed; retrying in 20s" >&2
            sleep 20
          done
          gh release create "$TAG" --verify-tag --title "$TAG" \
            --notes "Automated release $TAG."

  build-cli:
    name: build + release sumo CLI
    needs: bump
    uses: ./.github/workflows/release-sumo.yml
    with:
      tag: ${{ needs.bump.outputs.tag }}
    secrets: inherit
    permissions:
      contents: write

  npm-publish:
    name: publish sigmakee to npm
    needs: bump
    if: ${{ inputs.publish_npm }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # OIDC — required for npm trusted publishing
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: npm-publish-wasm

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Build npm package
        # sigmakee's `prepare` hook is the build, so this produces dist/ once
        # and both publish commands below act on those same bytes.
        run: npm ci

      - name: Publish (npm trusted publishing / OIDC)
        # No token: the job's OIDC identity (repo + this workflow filename,
        # registered as the package's Trusted Publisher on npmjs.com)
        # authenticates the publish.  Requires npm >= 11.5.1 — Node 24's
        # bundled npm qualifies; the version check below fails fast with a
        # clear message if the runner image ever regresses.
        working-directory: packages/sigmakee
        run: |
          set -euo pipefail
          NPM_VER=$(npm --version)
          if [ "$(printf '%s\n11.5.1\n' "$NPM_VER" | sort -V | head -1)" != "11.5.1" ]; then
            echo "npm $NPM_VER < 11.5.1 — too old for trusted publishing" >&2
            exit 1
          fi
          # --ignore-scripts: without it each command re-runs the build, which
          # starts by deleting dist/, so the dry run would inspect a tarball
          # that is then replaced by an unverified rebuild.
          npm publish --dry-run --ignore-scripts
          npm publish --ignore-scripts
