[package]
name    = "sumo-parser-wasm"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Direct path dep with `default-features = false` (NOT `workspace = true`):
# the workspace edge turns on core's default `ask` feature, which spawns
# subprocess provers and is `compile_error!`-banned on wasm32.  We enable only
# `native-prover` — the pure-Rust saturation prover, the one proving backend
# that runs in-browser. Vampire (WASM) proof-transcript parsing
# (`parse_vampire_result`) needs no feature of its own — it's ungated, part
# of core's default build (regex is a hard dependency there).
sigmakee-rs-core = { path = "../core", default-features = false, features = ["native-prover", "snapshot"] }
# The SDK Session is the sharing seam: WasmNativeProver holds its KB as an
# `Arc<RwLock<Session<ProverLayer<TranslationLayer>>>>` so the LSP facade
# (`WasmLsp`, below) can run against the SAME knowledge base.  Same
# direct-path / default-features = false posture as the core dep -- sdk's
# default `http`/`git`/`persist`/`ask` features are all wasm-hostile.
sigmakee-rs-sdk  = { path = "../sdk", default-features = false, features = ["native-prover", "snapshot"] }
# The LSP server library (transport-free dispatch core only -- the stdio shell
# is never invoked here) + the lsp-server message types the JSON bridge speaks.
sumo-lsp         = { path = "../lsp" }
lsp-server       = "0.7"
serde.workspace            = true
serde_json.workspace       = true
# Bridges `sumo-lsp`'s existing `log::debug!`/`log::info!` calls (already
# used for request tracing, e.g. handle_completion) to the browser console --
# without this, those calls compile fine (the `log` macros silently no-op
# with no logger registered) but are invisible in the browser. See
# console_log.rs.
log.workspace              = true
wasm-bindgen               = "0.2"
serde-wasm-bindgen         = "0.6"
js-sys                     = "0.3"

# parallel feature: `sigmakee-rs-core/parallel` is itself compile_error!-banned
# on plain wasm32 (see core's lib.rs) — it only compiles in a threads-enabled
# build (atomics + bulk-memory via -Zbuild-std), which this repo's own build
# pipeline does not produce. wasm-bindgen-rayon supplies the JS-callable
# `initThreadPool` that spins up the worker pool this feature's rayon calls
# then run on.
wasm-bindgen-rayon         = { version = "1", optional = true }

# Feature-unification rider, not used directly: dashmap's shard locks (core's
# EntryCache) sit on parking_lot_core, whose wasm-atomics thread parker is
# gated behind its `nightly` crate feature. Without it, wasm gets a fallback
# parker whose park() PANICS ("Parking not supported on this platform") — the
# first contended shard lock aborts a rayon worker (panic=abort) and the
# dispatching par_iter hangs forever. Contention-dependent, so small KBs and
# 1-worker pools mask it. Threaded builds compile on nightly anyway.
parking_lot_core           = { version = "0.9", features = ["nightly"], optional = true }

# Release-profile overrides for this crate live at the workspace root
# (`[profile.release.package.sumo-parser-wasm]`) — Cargo only honours
# profile sections at the root.

[features]
parallel = ["sigmakee-rs-core/parallel", "dep:wasm-bindgen-rayon", "dep:parking_lot_core"]
