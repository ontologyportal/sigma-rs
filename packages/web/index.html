<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SigmaKEE</title>
    <!-- Cropped from the existing mascot (public/logo.png, already used
         elsewhere in the app as the loading-spinner icon), not a new mark:
         faces read at 16px far better than the full illustration does. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="./src/styles.css" />
    <script>
      // Apply a saved theme choice before first paint to avoid a flash.
      try {
        const t = localStorage.getItem("sumoBrowserTheme");
        if (t) document.documentElement.dataset.theme = t;
      } catch {
        /* storage unavailable — fall back to the OS preference */
      }
    </script>
  </head>
  <body>
    <div id="app"></div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
