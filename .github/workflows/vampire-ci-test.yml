name: Test Vampire WASM

on:
  push:
    branches: [issue-238]

permissions:
  contents: read

jobs:
  vampire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: "6.0.12"

      - run: emcc -v
      - run: sudo apt-get update && sudo apt-get install -y gawk cmake
      - run: bash packages/vampire/build.sh
      - run: test -s packages/vampire/dist/vampire.wasm
