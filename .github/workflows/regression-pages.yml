# GitHub Pages: the in-browser demo (always) + the SUMO regression report.
# The demo is ADDITIONALLY deployed to Cloudflare Pages (see the "Deploy demo
# to Cloudflare Pages" step) because only Cloudflare can serve the COOP/COEP
# headers the in-browser Vampire backend needs; the regression report lives on
# GitHub Pages only.
#
# Two triggers, one Pages artifact:
#   * push to main  — fast: rebuild the demo and redeploy it alongside the MOST
#                     RECENT regression report (re-fetched from the live site).
#                     The regression battery itself does NOT run on push.
#   * nightly cron / manual dispatch — run the full regression battery, rebuild
#                     the report AND the demo, and deploy both.
#
# The regression battery (only on the nightly/dispatch path):
#   * ontology  — `sumo -c --git https://github.com/ontologyportal/sumo load`
#   * SUMO tests — tests/**/*.kif.tq via the GitHub trees API + the CLI's http feature
#   * TPTP smoke — .github/scripts/fetch_tptp.py scrapes tptp.org's SeeTPTP pages
#   * vampire   — a prebuilt Linux release binary on PATH (subprocess backend + compare column)
#
# Results are published, not graded: the page diffs each run against the previous
# published run and keeps a history table (the live site's results.json/history.json
# are the storage).  The trailing `gate` job (nightly only) turns the run red when
# the run itself was unhealthy.
#
# One-time repo setup: Settings → Pages → Source: "GitHub Actions".

name: Web App Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sumo_branch:
        description: ontologyportal/sumo branch to test against
        default: master
      tptp_budget:
        description: per-problem seconds for the TPTP smoke slice
        default: "10"
      ext_budget:
        description: per-test cap (seconds) for external prover backends
        default: "60"
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: regression-pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Bump to track a newer vprover/vampire release; must have a
  # vampire-Linux-X64.zip release asset (true from v5.0.0 on).
  VAMPIRE_VERSION: v5.0.1
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  regression:
    name: build pages
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      status: ${{ steps.status.outputs.status }}
      demo: ${{ steps.demo.outcome }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: regression-pages

      # ---- Regression battery: nightly cron / manual dispatch only ----------
      - name: Install CMake + toolchain deps (embedded Vampire FFI)
        if: github.event_name != 'push'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      # A standalone `vampire` binary on PATH — separate from the embedded
      # FFI build above — turns on the SUMO pool's `subprocess` backend and
      # the TPTP smoke slice's raw-vampire comparison column (see
      # ci_regression.sh). Cached by version so this is a cache hit on every
      # run except a VAMPIRE_VERSION bump.
      - name: Cache vampire binary
        if: github.event_name != 'push'
        id: cache-vampire
        uses: actions/cache@v4
        with:
          path: ~/.local/vampire-bin
          key: vampire-${{ env.VAMPIRE_VERSION }}-linux-x64

      - name: Install vampire
        if: github.event_name != 'push' && steps.cache-vampire.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/vampire-bin
          curl -fsSL -o /tmp/vampire.zip \
            "https://github.com/vprover/vampire/releases/download/${VAMPIRE_VERSION}/vampire-Linux-X64.zip"
          unzip -q /tmp/vampire.zip -d ~/.local/vampire-bin
          chmod +x ~/.local/vampire-bin/vampire

      - name: Add vampire to PATH
        if: github.event_name != 'push'
        run: |
          echo "$HOME/.local/vampire-bin" >> "$GITHUB_PATH"
          "$HOME/.local/vampire-bin/vampire" --version

      - name: Build sumo (release)
        if: github.event_name != 'push'
        run: cargo build --release --bin sumo

      # The scraped TPTP tree only changes when the problem list (or the
      # scraper) does — cache it so tptp.org is normally never touched.
      - name: Cache TPTP problem tree
        if: github.event_name != 'push'
        uses: actions/cache@v4
        with:
          path: ~/TPTP
          key: tptp-tree-${{ hashFiles('.github/scripts/tptp_regression.list', '.github/scripts/fetch_tptp.py') }}

      - name: Fetch TPTP problems (tptp.org SeeTPTP scrape, cache misses only)
        if: github.event_name != 'push'
        run: python3 .github/scripts/fetch_tptp.py --list .github/scripts/tptp_regression.list --dest ~/TPTP

      - name: Run regression (remote ontology + tests)
        if: github.event_name != 'push'
        id: regress
        continue-on-error: true
        env:
          SKIP_BUILD: "1"
          SUMO_BRANCH: ${{ inputs.sumo_branch || 'master' }}
          TPTP_BUDGET: ${{ inputs.tptp_budget || '10' }}
          EXT_BUDGET: ${{ inputs.ext_budget || '60' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          TPTP="$HOME/TPTP" bash .github/scripts/ci_regression.sh

      - name: Report status
        if: github.event_name != 'push'
        id: status
        run: |
          status=$(cat regression-out/status 2>/dev/null || echo FAIL)
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "Regression status: $status"

      # The previous deploy's results.json/history.json seed the "changes
      # since last run" section and the history table — the site itself is
      # the storage, carried forward deploy to deploy.  Both fetches are
      # best-effort: a first run (or disabled Pages) just builds without them.
      - name: Fetch previous published results (deltas + history)
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prev
          url=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url 2>/dev/null || true)
          [ -n "$url" ] || url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          echo "pages url: $url"
          curl -fsSL "${url%/}/results.json?run=$GITHUB_RUN_ID" -o prev/results.json || true
          curl -fsSL "${url%/}/history.json?run=$GITHUB_RUN_ID" -o prev/history.json || true
          ls -la prev/ || true

      - name: Build report site
        if: github.event_name != 'push'
        run: |
          python3 .github/scripts/regression_report.py \
            --results regression-out \
            --out site \
            --prev prev/results.json \
            --history prev/history.json \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Upload raw results (debugging)
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: regression-out
          path: |
            regression-out
            !regression-out/work
          retention-days: 14

      # ---- Push builds: keep the most recent regression report --------------
      # No regression run on push. The report is self-contained (index.html +
      # results/history/badge json), so re-fetch it from the live Pages site
      # and republish it beside the freshly-built demo. Best-effort: on a first
      # deploy (no site yet) the report is simply absent until the next nightly.
      - name: Restore last published report
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site
          url=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url 2>/dev/null || true)
          [ -n "$url" ] || url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          echo "pages url: $url"
          for f in index.html results.json history.json badge.json; do
            curl -fsSL "${url%/}/$f?run=$GITHUB_RUN_ID" -o "site/$f" \
              && echo "restored $f" || echo "no prior $f (first deploy?)"
          done

      # ---- In-browser demo: every build (push + nightly) --------------------
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install npm workspace (for the demo)
        # Deliberately not best-effort: every step below needs these
        # node_modules, and sigmakee's `prepare` hook builds the wasm package
        # here. Also supplies `binaryen` for the wasm-opt size pass.
        run: npm ci

      # The Vampire (WASM) backend needs its own toolchain: the Emscripten SDK
      # (compiles Vampire's C++ to wasm) and gawk (the build's patch step
      # requires GNU awk; Ubuntu's default awk already is gawk, but the script
      # checks `command -v gawk` explicitly, so install it under that name
      # too). Best-effort like the Rust wasm toolchain above - a missing
      # Vampire backend degrades gracefully in the UI (sigma.worker.js).
      - name: Install Emscripten SDK + gawk (for the Vampire WASM backend)
        continue-on-error: true
        uses: mymindstorm/setup-emsdk@v14
        with:
          # No specific version pinned here: the Vampire build's own pin
          # (VAMPIRE_GUIDE_REF) is what determines reproducibility of the
          # *output*; the emsdk cache below is keyed on that same ref so a
          # guide bump also gets a fresh emsdk if setup-emsdk's default moves.
          actions-cache-folder: emsdk-cache

      - name: Install gawk
        continue-on-error: true
        run: sudo apt-get install -y gawk

      # Extract the pinned vampireGuide ref so the expensive C++ -> WASM
      # compile below is cache-keyed on it: a cache hit means "nothing to do,
      # the built vampire.wasm from the last run at this pin is still good."
      - name: Read pinned Vampire guide ref
        id: vampire-ref
        run: |
          ref=$(grep -oE 'VAMPIRE_GUIDE_REF=\$\{VAMPIRE_GUIDE_REF:-[0-9a-f]+\}' packages/vampire/build.sh \
                | grep -oE '[0-9a-f]{8,}')
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "pinned vampireGuide ref: $ref"

      # Keyed on the pin above. The build's own skip-stamp
      # (.vampire-cache/BUILT_REF) is not restored here and does not need to
      # be: a cache hit skips the build step outright, a miss rebuilds fully.
      - name: Cache Vampire WASM build output
        id: cache-vampire-wasm
        uses: actions/cache@v4
        with:
          path: packages/vampire/dist
          key: vampire-wasm-${{ steps.vampire-ref.outputs.ref }}

      - name: Build the Vampire WASM backend
        continue-on-error: true
        if: steps.cache-vampire-wasm.outputs.cache-hit != 'true'
        run: npm run build --workspace @sigma/vampire

      - name: Build & stage the in-browser demo at /browse
        id: demo
        continue-on-error: true
        # SKIP_VAMPIRE/NO_REBUILD: both are already built by the steps above,
        # so the mirror step only needs to copy Vampire into the site.
        #
        # Built twice because the mount point is baked into the bundle: Pages
        # serves this under /browse/, Cloudflare at its root. See vite.config.js.
        env:
          SKIP_VAMPIRE: '1'
          NO_REBUILD: '1'
        run: |
          VITE_BASE=/browse/ npm run build --workspace @sigma/web
          mkdir -p site/browse
          cp -R packages/web/dist/* site/browse/

          VITE_BASE=/ npm run build --workspace @sigma/web
          mkdir -p site-cloudflare
          cp -R packages/web/dist/* site-cloudflare/

          # The deploy gate below keys off this file.
          test -f site/browse/index.html

      # Stamps the demo with the workspace crate version + this run's build
      # number/commit/timestamp. Read client-side by the Settings modal
      # (app.js fetches ./version.json). Written into the deploy artifact
      # only — nothing is committed back to the repo — so it updates on
      # every deploy (push or nightly) with zero write-back complexity.
      - name: Write demo version info
        if: steps.demo.outcome == 'success'
        run: |
          pkg_version=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          cat > site/browse/version.json <<EOF
          {
            "version": "${pkg_version}",
            "build": ${GITHUB_RUN_NUMBER},
            "commit": "${GITHUB_SHA:0:7}",
            "deployedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat site/browse/version.json

      # ---- Cloudflare Pages: the demo, with COOP/COEP headers ---------------
      # GitHub Pages cannot send the Cross-Origin-Opener-Policy/-Embedder-Policy
      # response headers that the pthreads-built vampire.wasm needs for
      # SharedArrayBuffer, so the demo ALSO deploys to Cloudflare Pages, where
      # web/_headers supplies them — that copy has a working Vampire backend.
      # The GitHub Pages /browse copy stays deployed as-is (everything except
      # Vampire works there). This step skips quietly until the
      # CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID repo secrets are set.
      - name: Deploy demo to Cloudflare Pages
        if: ${{ steps.demo.outcome == 'success' && env.CLOUDFLARE_API_TOKEN != '' }}
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site-cloudflare --project-name=sigma-rs-browse --branch=main

      # A Pages deploy REPLACES the whole site, so publishing an artifact with
      # no browse/ in it would delete the live demo -- silently, since the demo
      # step is best-effort. Skipping leaves the previous site up.
      - name: Upload Pages artifact
        if: steps.demo.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Warn that the Pages deploy was skipped
        if: steps.demo.outcome != 'success'
        run: |
          echo "::warning::demo build failed; skipping the Pages deploy so the previous site stays live"

  deploy:
    name: deploy pages
    needs: regression
    # Nothing is uploaded when the demo build failed, so there would be no
    # artifact to deploy.
    if: needs.regression.outputs.demo == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Turns the run red when the nightly regression itself was unhealthy (build,
  # load, enumeration, TPTP inputs) — after the page is up. Skipped on push
  # builds, which don't run the battery.
  gate:
    name: run-health gate
    if: github.event_name != 'push'
    needs: [regression, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if regression failed
        run: |
          echo "status: ${{ needs.regression.outputs.status }}"
          test "${{ needs.regression.outputs.status }}" = "GREEN"
