# CI for sigmakee-rs-core / sumo-lsp / sigmakee.
#
# Jobs are split by dependency weight:
#
#   * lean-features: Linux-only, CMake-free lane covering the REDUCED
#                 feature sets that `--all-features` structurally cannot
#                 reach.  Cargo unifies features across a workspace build,
#                 so `--workspace --all-features` always hands every member
#                 a maximal dep graph -- the lean postures that
#                 `crates/lsp` and `crates/wasm` pin via
#                 `default-features = false` are only exercised here.
#                 Cheap (no vampire-sys, no CMake), so it runs first.
#
#   * full-matrix: Linux-only canonical test lane exercising
#                 `--all-features` over the whole workspace -- pulls
#                 in vampire-sys / vampire-lib via Cargo's git dependency
#                 and requires CMake.  Runs on every push / PR.
#
#   * cli-build:  cross-OS matrix building (and on non-Windows,
#                 testing) the `sigmakee` CLI with integrated-prover.
#                 Catches platform-specific regressions in the
#                 Vampire C++ build + Rust FFI surface before a
#                 tagged release hits `release-sumo.yml`.  `fail-
#                 fast: false` so a Windows-only failure doesn't
#                 cancel the proven-good platforms.
#
#   * audit:      enforces the core-library generalization posture
#                 (no LSP-flavoured deps in sigmakee-rs-core's dep graph,
#                 no LSP-flavoured names in sigmakee-rs-core's public API).
#                 Fast Linux job, catches accidental architectural
#                 drift on every PR.
#
# Editor-side packaging (VSCode extension, Neovim config, etc.) is
# explicitly out of scope for this CI -- the sigmakee CLI is published
# via release-sumo.yml.

name: Testing

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # -- Lean feature sets: what --all-features structurally cannot reach -------
  #
  # Runs the fast, CMake-free checks so a formatting or lean-build
  # regression reports in under a minute instead of behind the
  # vampire-sys build in `full-matrix`.
  lean-features:
    name: lean-features / ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          key: lean-features-linux

      - name: Format check
        run: cargo fmt --all --check

      # The lane deleted along with the old `lsp-fast` job.  CMake-free:
      # `ask` is the subprocess-prover backend, not the embedded FFI one.
      - name: Test sigmakee-rs-core (CMake-free -- persist,ask)
        run: cargo test -p sigmakee-rs-core --no-default-features --features persist,ask

      # sumo-lsp pins `sigmakee-rs-sdk` with `default-features = false`, which
      # lands on sigmakee-rs-core with NO prover features -- a configuration no
      # other job builds, and one that has silently broken before.  The
      # workspace lanes DO run these same tests, but only after feature
      # unification has handed sumo-lsp a maximal dep graph; this is the only
      # place they run against the graph the crate actually ships with.
      #
      # RUSTFLAGS is cleared for this step only: under the lean set the szs
      # parser and `clock::epoch_nanos` are dead code and emit 7 warnings that
      # `-D warnings` would promote to errors.  Restore the deny once those
      # items carry `cfg(any(feature = "ask", feature = "native-prover"))`.
      - name: Test sumo-lsp (lean SDK -- no prover features in core)
        run: cargo test -p sumo-lsp
        env:
          RUSTFLAGS: ""

  # -- Linux full matrix: all-features, incl. vampire-sys ---------------------
  full-matrix:
    name: full-matrix / ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install CMake + toolchain deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - uses: Swatinem/rust-cache@v2
        with:
          key: full-matrix-linux

      - name: Test workspace --all-features
        run: cargo test --workspace --all-features

      - name: Clippy --workspace --all-features
        run: cargo clippy --workspace --all-features --tests -- -D warnings

  # -- Cross-OS CLI build matrix: sigmakee + integrated-prover ---------------
  #
  # Every platform we ship a release for gets a build smoke-test on
  # every PR.  Compiles Vampire's C++ (via CMake) + the Rust FFI
  # shim + the `sigmakee` CLI; runs the workspace test suite on
  # platforms where integrated-prover has been confirmed working.
  #
  # Windows is built but not tested, and deliberately WITHOUT
  # integrated-prover — vampire-sys's embedded C++ FFI build doesn't
  # currently compile under MSVC, so win32-x64 builds with
  # `--features ask` instead (native in-process prover + external
  # subprocess `vampire`/`e` on PATH still work; only the embedded/FFI
  # `--backend embedded` option is unavailable there). Tests are
  # skipped on this platform to avoid noise until the Windows story
  # is proven further.
  #
  # Linux x86_64's build overlaps with `full-matrix` but adds
  # ~45 seconds; kept in the matrix so failures localise clearly
  # (build-only vs. workspace-tests) without cross-referencing.
  cli-build:
    name: cli-build / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15,         target: aarch64-apple-darwin,      label: darwin-arm64,    test: true  }
          - { os: macos-15-intel,   target: x86_64-apple-darwin,       label: darwin-x64,      test: true  }
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-gnu,  label: linux-x64-gnu,   test: true  }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, label: linux-arm64-gnu, test: true  }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,    label: win32-x64,       test: false }
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install CMake + toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - uses: Swatinem/rust-cache@v2
        with:
          key: cli-build-${{ matrix.label }}

      - name: Build sigmakee (release, integrated-prover)
        if: matrix.os != 'windows-latest'
        run: cargo build --release -p sigmakee --target ${{ matrix.target }}

      - name: Build sigmakee (release, no integrated-prover on Windows)
        if: matrix.os == 'windows-latest'
        run: cargo build --release -p sigmakee --target ${{ matrix.target }} --no-default-features --features ask,parallel,alloc-mi

      - name: Test workspace --all-features
        if: matrix.test
        run: cargo test --workspace --all-features

  # -- Generalization audit: no LSP leakage into sigmakee-rs-core ---------------------
  audit:
    name: audit / generalization gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: audit

      - name: Dep-graph denylist -- no LSP / async / buffer crates in sigmakee-rs-core
        run: |
          set -euo pipefail
          # `dashmap` is legitimately core's (EntryCache shard locks), and it
          # pulls `crossbeam-utils` transitively -- so neither can be denied.
          # `crossbeam-channel` stays denied: it is lsp-server's transport,
          # exactly the leak this gate exists to catch.
          DENYLIST='lsp-server|lsp-types|tower-lsp|ropey|^url$|crossbeam-channel|crossbeam-queue|arc-swap|^tokio$|^async-'
          if cargo tree -p sigmakee-rs-core --prefix none --edges normal 2>/dev/null \
             | awk '{print $1}' \
             | grep -E "${DENYLIST}"; then
            echo "::error::sigmakee-rs-core dep graph contains LSP-flavoured crates"
            exit 1
          fi
          echo "sigmakee-rs-core dep graph clean"

      - name: Public-API naming check -- no LSP-flavoured pub symbols in sigmakee-rs-core
        run: |
          set -euo pipefail
          # Grep sigmakee-rs-core's source for any public declaration whose
          # name starts with a reserved LSP-concept prefix.
          # Matches only lines where the name begins one of the
          # forbidden stems; doc comments that merely *mention*
          # "Position" (e.g. "independent of LSP's Position")
          # are left alone.
          PATTERN='^\s*pub(\s*\([^)]*\))?\s+(struct|enum|fn|trait|type|const|static)\s+(Lsp|Uri|Url[A-Z_]|Position[A-Z_])'
          # The package is `sigmakee-rs-core`; its directory is `crates/core`.
          # Pointing this at the package name made `grep -R` fail on a missing
          # path -- non-zero, so the `if` never fired and the gate always
          # reported clean without reading a single file.
          if grep -R -nE "${PATTERN}" crates/core/src; then
            echo "::error::sigmakee-rs-core public API contains an LSP-flavoured symbol name"
            exit 1
          fi
          echo "sigmakee-rs-core public API naming clean"
